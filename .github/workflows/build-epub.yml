name: Build and Release EPUBs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-epub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Bunchló GC font (best-effort)
        run: |
          mkdir -p epub/fonts
          if curl -fsSL --retry 3 --connect-timeout 15 https://www.gaelchlo.com/bungc.zip -o /tmp/bungc.zip; then
            unzip -j -o -q /tmp/bungc.zip -d epub/fonts
            rm -f /tmp/bungc.zip
            test -f epub/fonts/bungc.otf
            ls -la epub/fonts
          else
            echo "::warning::Could not download bungc.zip from gaelchlo.com; falling back to system serif."
          fi

      - name: Build EPUB editions
        run: |
          cd epub
          make clean
          make
          if [ -f fonts/bungc.otf ]; then
            make kindle
          else
            echo "Skipping Manannán-old-kindle.epub because Bunchló GC font was not fetched."
          fi

      - name: Validate built EPUB archives
        run: |
          python3 - <<'PY'
          import glob, os, zipfile, xml.etree.ElementTree as ET
          epubs = sorted(glob.glob("epub/*.epub"))
          assert epubs, "No EPUB files built"
          has_font = os.path.isfile("epub/fonts/bungc.otf")
          for epub in epubs:
              with zipfile.ZipFile(epub) as zf:
                  infos = zf.infolist()
                  names = {info.filename for info in infos}
                  assert infos[0].filename == "mimetype" and infos[0].compress_type == zipfile.ZIP_STORED
                  assert zf.read("mimetype") == b"application/epub+zip"
                  if has_font and "old" in os.path.basename(epub):
                      assert "OEBPS/fonts/bungc.otf" in names, f"Missing embedded font in {epub}"
                  for info in infos:
                      if info.filename.endswith((".xml", ".xhtml", ".opf", ".ncx")):
                          ET.fromstring(zf.read(info.filename))
                  print(f"Validated {epub} ({len(infos)} entries)")
          PY

      - name: Update rolling latest GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Automated EPUB 3 builds from \`main\` (${SHORT_SHA})."
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Manannán (Latest)" --notes "${NOTES}"
            gh release upload latest epub/*.epub --clobber
          else
            gh release create latest epub/*.epub --title "Manannán (Latest)" --notes "${NOTES}"
          fi
